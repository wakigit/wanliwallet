<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="WanliWallet"/>
<title>WanliWallet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&display=swap" rel="stylesheet"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;min-height:100vh;color:#3A1A2E;background:#FFB3CE}
.app{max-width:430px;margin:0 auto;padding:1rem 0.9rem 5.5rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.display{font-family:'Caprasimo',cursive;font-weight:400}
.card{background:rgba(255,255,255,0.88);border:1px solid rgba(230,170,190,0.45);border-radius:18px;padding:1.1rem 1.2rem;margin-bottom:0.9rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lbl{font-family:'Caprasimo',cursive;font-size:13px;color:#C0708A;margin:0 0 0.9rem;letter-spacing:0.01em}
.field{margin-bottom:0.9rem}
.field label{font-size:13px;color:#8A5870;display:block;margin-bottom:5px;font-weight:500}
input,select{background:rgba(255,255,255,0.96);border:1.5px solid rgba(220,160,180,0.55);color:#3A1A2E;padding:12px 14px;border-radius:13px;font-family:inherit;font-size:15px;width:100%;outline:none;-webkit-appearance:none;transition:border-color .15s,box-shadow .15s;min-height:48px}
input:focus,select:focus{border-color:#E8709A;box-shadow:0 0 0 3px rgba(232,112,154,0.13)}
input[type=date]{color-scheme:light}
input.err{border-color:#C04040!important;box-shadow:0 0 0 3px rgba(192,64,64,0.13)!important}
button{background:rgba(255,255,255,0.92);border:1.5px solid rgba(220,160,180,0.6);color:#3A1A2E;padding:10px 16px;border-radius:13px;font-family:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;transition:all .12s;-webkit-tap-highlight-color:transparent}
button:hover{background:#fff}
button:active{transform:scale(.97)}
.btn-primary{background:#E8709A;border:none;color:#fff;font-weight:600;box-shadow:0 3px 14px rgba(232,112,154,0.32)}
.btn-primary:hover{background:#D96090}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,225,235,0.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(220,160,180,0.4);display:flex;align-items:center;justify-content:space-around;padding:6px 0 max(8px,env(safe-area-inset-bottom));z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;min-height:auto;padding:7px 14px;border-radius:14px;color:#C09AAA;font-size:10px;font-weight:500}
.nav-btn.active{color:#E8709A;background:rgba(232,112,154,0.13)}
.progress-track{background:rgba(230,180,200,0.28);border-radius:4px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:4px;transition:width .4s ease}
.txn-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-radius:12px}
.txn-row:active{background:rgba(232,112,154,0.07)}
.icon-btn{background:transparent;border:none;padding:6px;min-height:40px;min-width:40px;border-radius:10px;font-size:16px;color:#C09AAA;cursor:pointer}
.icon-btn:active{background:rgba(232,112,154,0.1);transform:scale(.9)}
.danger-zone{background:rgba(255,210,220,0.75);padding:9px 12px;border-radius:0 0 12px 12px}
.swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:border-color .12s;-webkit-tap-highlight-color:transparent}
.swatch.sel{border-color:#3A1A2E}
.cancel-link{background:transparent;border:none;color:#B07090;font-size:13px;padding:6px;text-decoration:underline;min-height:auto}
/* Month picker bottom sheet */
.overlay{position:fixed;inset:0;background:rgba(58,26,46,0.4);z-index:200;display:flex;align-items:flex-end;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:rgba(255,238,246,0.98);border-radius:24px 24px 0 0;width:100%;max-height:68vh;overflow-y:auto;padding:.75rem 1rem max(1.5rem,env(safe-area-inset-bottom))}
.handle{width:38px;height:4px;background:rgba(200,140,165,0.45);border-radius:2px;margin:0 auto 1rem}
.m-item{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-radius:13px;cursor:pointer;margin-bottom:3px;-webkit-tap-highlight-color:transparent}
.m-item:active{background:rgba(232,112,154,0.18)}
.m-item.sel{background:rgba(232,112,154,0.13)}
.yr-hdr{font-family:'Caprasimo',cursive;font-size:11px;color:#C0708A;padding:8px 12px 4px;letter-spacing:.06em}
/* History tab */
.hist-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;cursor:pointer;border-radius:12px;-webkit-tap-highlight-color:transparent}
.hist-row:active{background:rgba(232,112,154,0.08)}
</style>
</head>

<div id="root"></div>

<script>
function bow(cx,cy,hw,hh,fill,knot,rot){const g0=rot?`<g transform="rotate(${rot} ${cx} ${cy})">`:'<g>';const lw=`M${cx},${cy} Q${cx-hw*.38},${cy-hh} ${cx-hw},${cy} Q${cx-hw},${cy} ${cx-hw*.38},${cy+hh} ${cx},${cy}Z`;const rw=`M${cx},${cy} Q${cx+hw*.38},${cy-hh} ${cx+hw},${cy} Q${cx+hw},${cy} ${cx+hw*.38},${cy+hh} ${cx},${cy}Z`;const kr=Math.max(4,hh*.34);const dx=cx-hw*.55,dxr=cx+hw*.55,dy0=cy-hh*.22,dy1=cy+hh*.22;return`${g0}<path d="${lw}" fill="${fill}" opacity="0.9"/><path d="${rw}" fill="${fill}" opacity="0.9"/><circle cx="${dx}" cy="${dy0}" r="1.8" fill="white" opacity="0.62"/><circle cx="${dx}" cy="${dy1}" r="1.8" fill="white" opacity="0.62"/><circle cx="${dxr}" cy="${dy0}" r="1.8" fill="white" opacity="0.62"/><circle cx="${dxr}" cy="${dy1}" r="1.8" fill="white" opacity="0.62"/><circle cx="${cx}" cy="${cy}" r="${kr}" fill="${knot}"/></g>`;}
const bows=[[58,52,23,15,'#A8D8F0','#78B8D4',0],[188,30,18,11,'#F7E8A0','#D4C060',15],[316,68,23,15,'#E8C0F0','#B890D4',-10],[82,155,21,13,'#B8F0C8','#78D490',5],[230,130,26,16,'#F0B8C8','#D480A8',0],[350,195,20,13,'#A8D8F0','#78B8D4',-15],[132,238,22,14,'#F7E8A0','#D4C060',10],[275,250,20,12,'#B8F0C8','#78D490',0],[162,108,17,11,'#F0B8C8','#D480A8',-20],[360,138,21,13,'#E8C0F0','#B890D4',6],[14,198,18,11,'#A8D8F0','#78B8D4',12],[205,200,20,12,'#F7E8A0','#D4C060',-8],[22,88,16,10,'#E8C0F0','#B890D4',-5],[378,30,17,11,'#B8F0C8','#78D490',8]].map(b=>bow(...b)).join('');
document.getElementById('bg').innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" style="position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none"><defs><pattern id="pk" x="10" y="10" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="2.8" fill="white" opacity="0.38"/></pattern><pattern id="mp" x="0" y="0" width="390" height="285" patternUnits="userSpaceOnUse"><rect width="390" height="285" fill="#FFB3CE"/><rect width="390" height="285" fill="url(#pk)"/>${bows}<text x="92" y="196" font-family="cursive" font-size="14" fill="#E8709A" opacity="0.3" transform="rotate(-15 92 196)">WanliWallet</text><text x="248" y="86" font-family="cursive" font-size="12" fill="#E8709A" opacity="0.28" transform="rotate(10 248 86)">WanliWallet</text><text x="288" y="260" font-family="cursive" font-size="11" fill="#E8709A" opacity="0.25" transform="rotate(-8 288 260)">WanliWallet</text></pattern></defs><rect width="100%" height="100%" fill="url(#mp)"/></svg>`;
</script>

<script>
const {useState,useEffect,useRef,useMemo}=React;
const PALETTE=['#D85A30','#1D9E75','#378ADD','#7F77DD','#BA7517','#888780','#D4537E','#639922','#E24B4A','#5DCAA5','#EF9F27','#534AB7','#E8709A','#60B0E0'];
const DEF_CATS=[{id:'food',label:'Food',color:'#D85A30'},{id:'hire',label:'Private hire',color:'#1D9E75'},{id:'pub',label:'Public transport',color:'#378ADD'},{id:'shop',label:'Shopping',color:'#7F77DD'},{id:'needs',label:'Needs',color:'#BA7517'},{id:'misc',label:'Miscellaneous',color:'#888780'}];
const fmt=n=>Number(n).toFixed(2);
const today=()=>new Date().toISOString().slice(0,10);
const curYm=()=>{const n=new Date();return`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}`;};
const ymLabel=ym=>{const[y,m]=ym.split('-');return new Date(y,m-1).toLocaleString('en-SG',{month:'long',year:'numeric'});};

// Persistent storage with in-memory fallback
async function loadKey(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;}}
async function saveKey(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

function Donut({data,size=130,inner=38,outer=58}){
  const total=data.reduce((s,d)=>s+d.value,0);
  if(!total)return null;
  const cx=size/2,cy=size/2;let a=-Math.PI/2;
  const slices=data.map(d=>{const sw=(d.value/total)*2*Math.PI,x1=cx+outer*Math.cos(a),y1=cy+outer*Math.sin(a);a+=sw;const x2=cx+outer*Math.cos(a),y2=cy+outer*Math.sin(a),ix1=cx+inner*Math.cos(a-sw),iy1=cy+inner*Math.sin(a-sw),ix2=cx+inner*Math.cos(a),iy2=cy+inner*Math.sin(a),big=sw>Math.PI?1:0;return{...d,path:`M${x1},${y1} A${outer},${outer} 0 ${big} 1 ${x2},${y2} L${ix2},${iy2} A${inner},${inner} 0 ${big} 0 ${ix1},${iy1} Z`};});
  return React.createElement('svg',{width:size,height:size,viewBox:`0 0 ${size} ${size}`},slices.map((s,i)=>React.createElement('path',{key:i,d:s.path,fill:s.color})));
}

function NavIcon({id}){
  const e=React.createElement;
  const svg=ch=>e('svg',{viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'2',width:24,height:24,strokeLinecap:'round',strokeLinejoin:'round'},ch);
  if(id==='home')return svg([e('path',{key:'h',d:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z'}),e('polyline',{key:'p',points:'9 22 9 12 15 12 15 22'})]);
  if(id==='history')return svg([e('circle',{key:'c',cx:'12',cy:'12',r:'10'}),e('polyline',{key:'p',points:'12 6 12 12 16 14'})]);
  if(id==='add')return svg([e('circle',{key:'c',cx:'12',cy:'12',r:'10'}),e('line',{key:'v',x1:'12',y1:'8',x2:'12',y2:'16'}),e('line',{key:'h',x1:'8',y1:'12',x2:'16',y2:'12'})]);
  return svg([e('circle',{key:'c',cx:'12',cy:'12',r:'3'}),e('path',{key:'g',d:'M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z'})]);
}

function App(){
  const[ready,setReady]=useState(false);
  const[cats,setCats]=useState(DEF_CATS);
  const[expenses,setExp]=useState([]);
  const[budgets,setBudgets]=useState({});
  const[ym,setYm]=useState(curYm());
  const[tab,setTab]=useState('home');
  const[editId,setEditId]=useState(null);
  const[form,setForm]=useState({date:today(),category:'food',description:'',amount:'',notes:''});
  const[budDraft,setBudDraft]=useState({});
  const[delExpId,setDelExpId]=useState(null);
  const[delCatId,setDelCatId]=useState(null);
  const[newCat,setNewCat]=useState({label:'',color:'#D85A30'});
  const[saved,setSaved]=useState(false);
  const[showPicker,setShowPicker]=useState(false);
  const[formErr,setFormErr]=useState({});
  const descRef=useRef(null);

  // Load
  useEffect(()=>{(async()=>{const[ex,bu,ca]=await Promise.all([loadKey('ww_exp'),loadKey('ww_bud'),loadKey('ww_cats')]);if(ex)setExp(ex);if(bu){setBudgets(bu);setBudDraft(bu);}if(ca)setCats(ca);setReady(true);})();},[]);
  useEffect(()=>{if(ready)saveKey('ww_exp',expenses);},[expenses,ready]);
  useEffect(()=>{if(ready)saveKey('ww_bud',budgets);},[budgets,ready]);
  useEffect(()=>{if(ready)saveKey('ww_cats',cats);},[cats,ready]);

  // Auto-focus description field when Add tab opens
  useEffect(()=>{if(tab==='add')setTimeout(()=>descRef.current?.focus(),160);},[tab,editId]);

  // Build month list from earliest expense to today
  const monthList=useMemo(()=>{
    const cur=curYm();
    if(!expenses.length)return[cur];
    const earliest=expenses.map(e=>e.date.slice(0,7)).sort()[0];
    const[ey,em]=earliest.split('-').map(Number);
    const list=[];let d=new Date(ey,em-1);
    const now=new Date(),end=new Date(now.getFullYear(),now.getMonth());
    while(d<=end){list.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);d=new Date(d.getFullYear(),d.getMonth()+1);}
    return list.reverse();
  },[expenses]);

  const histByYear=useMemo(()=>{const g={};monthList.forEach(m=>{const y=m.slice(0,4);(g[y]=g[y]||[]).push(m);});return Object.entries(g).sort(([a],[b])=>b-a);},[monthList]);
  const getMonthTotals=m=>{const ex=expenses.filter(e=>e.date.startsWith(m));return{spent:ex.reduce((s,e)=>s+Number(e.amount),0),count:ex.length};};

  // Current month
  const monthExp=expenses.filter(e=>e.date.startsWith(ym)).sort((a,b)=>b.date.localeCompare(a.date));
  const spending=cats.reduce((acc,c)=>{acc[c.id]=monthExp.filter(e=>e.category===c.id).reduce((s,e)=>s+Number(e.amount),0);return acc;},{});
  const totalSpent=Object.values(spending).reduce((a,b)=>a+b,0);
  const totalBudget=cats.reduce((s,c)=>s+(budgets[c.id]||0),0);
  const remaining=totalBudget-totalSpent;
  const budPct=totalBudget>0?Math.min(Math.round((totalSpent/totalBudget)*100),100):0;
  const chartData=cats.filter(c=>spending[c.id]>0).map(c=>({name:c.label,value:spending[c.id],color:c.color}));
  const isOver=totalSpent>totalBudget&&totalBudget>0;

  const changeMonth=dir=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+dir);setYm(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);};

  const submit=()=>{
    const errs={};
    if(!form.description.trim())errs.description=true;
    if(!form.amount)errs.amount=true;
    if(Object.keys(errs).length){setFormErr(errs);return;}
    setFormErr({});
    const entry={...form,amount:parseFloat(form.amount)};
    if(editId!==null){setExp(p=>p.map(e=>e.id===editId?{...entry,id:editId}:e));setEditId(null);}
    else setExp(p=>[...p,{...entry,id:Date.now()}]);
    setForm({date:today(),category:cats[0]?.id||'',description:'',amount:'',notes:''});
    setTab('home');
  };

  const startEdit=exp=>{setForm({date:exp.date,category:exp.category,description:exp.description,amount:String(exp.amount),notes:exp.notes||''});setEditId(exp.id);setTab('add');};
  const cancelEdit=()=>{setEditId(null);setFormErr({});setForm({date:today(),category:cats[0]?.id||'',description:'',amount:'',notes:''});setTab('home');};
  const addCat=()=>{if(!newCat.label.trim())return;const id='cat_'+Date.now();setCats(p=>[...p,{id,label:newCat.label.trim(),color:newCat.color}]);setBudgets(b=>({...b,[id]:0}));setBudDraft(b=>({...b,[id]:0}));setNewCat({label:'',color:'#D85A30'});};
  const delCat=id=>{setCats(p=>p.filter(c=>c.id!==id));setExp(p=>p.filter(e=>e.category!==id));setBudgets(b=>{const n={...b};delete n[id];return n;});setBudDraft(b=>{const n={...b};delete n[id];return n;});setDelCatId(null);};
  const saveBudgets=()=>{setBudgets(budDraft);setSaved(true);setTimeout(()=>setSaved(false),1500);};
  const catById=id=>cats.find(c=>c.id===id);
  const sf=k=>ev=>{setForm(f=>({...f,[k]:ev.target.value}));setFormErr(f=>({...f,[k]:false}));};
  const goTo=t=>{if(t==='add'&&!editId){setForm({date:today(),category:cats[0]?.id||'',description:'',amount:'',notes:''});setFormErr({});}if(t==='settings')setBudDraft({...budgets});setTab(t);};

  const e=React.createElement;
  if(!ready)return e('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',color:'#C09AAA',fontFamily:"'Caprasimo',cursive",fontSize:18}},'WanliWallet 🎀');

  return e('div',null,

    // ── Month picker bottom sheet ──
    showPicker&&e('div',{className:'overlay',onClick:ev=>{if(ev.target===ev.currentTarget)setShowPicker(false);}},
      e('div',{className:'sheet'},
        e('div',{className:'handle'}),
        e('p',{style:{textAlign:'center',fontFamily:"'Caprasimo',cursive",fontSize:14,color:'#C0708A',marginBottom:'0.75rem'}},'Select month'),
        histByYear.map(([year,months])=>e(React.Fragment,{key:year},
          e('div',{className:'yr-hdr'},year),
          months.map(m=>{
            const{spent,count}=getMonthTotals(m);
            return e('div',{key:m,className:'m-item'+(ym===m?' sel':''),onClick:()=>{setYm(m);setShowPicker(false);setTab('home');}},
              e('div',null,
                e('span',{style:{fontSize:15,fontWeight:ym===m?700:400,color:ym===m?'#E8709A':'#3A1A2E'}},ymLabel(m)),
                count>0&&e('span',{style:{fontSize:11,color:'#C09AAA',marginLeft:8}},count+' entries')
              ),
              e('div',{style:{display:'flex',alignItems:'center',gap:8}},
                spent>0&&e('span',{style:{fontSize:13,fontWeight:600,color:'#8A5870'}},'S$'+fmt(spent)),
                ym===m&&e('span',{style:{fontSize:16,color:'#E8709A'}},'✓')
              )
            );
          })
        ))
      )
    ),

    e('div',{className:'app'},
      e('h1',{className:'sr-only'},'WanliWallet'),

      // ── Header ──
      e('div',{style:{textAlign:'center',marginBottom:'1.2rem',paddingTop:'0.4rem'}},
        e('div',{className:'display',style:{fontSize:'1.95rem',color:'#3A1A2E',marginBottom:'0.5rem'}},'WanliWallet 🎀'),
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:10}},
          e('button',{onClick:()=>changeMonth(-1),style:{border:'none',background:'transparent',fontSize:24,padding:'2px 10px',minHeight:'auto',color:'#C08098'}},'‹'),
          e('button',{onClick:()=>setShowPicker(true),style:{border:'1.5px solid rgba(220,160,180,0.5)',background:'rgba(255,255,255,0.78)',borderRadius:12,padding:'6px 14px',fontSize:14,fontWeight:600,color:'#7A4060',minHeight:'auto',gap:5}},
            ymLabel(ym),e('span',{style:{fontSize:10,color:'#C09AAA'}},'▾')
          ),
          e('button',{onClick:()=>changeMonth(1),style:{border:'none',background:'transparent',fontSize:24,padding:'2px 10px',minHeight:'auto',color:'#C08098'}},'›')
        )
      ),

      // ══ HOME ══
      tab==='home'&&e(React.Fragment,null,
        e('div',{className:'card'},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:13}},
            e('div',null,
              e('p',{style:{fontSize:12,color:'#C09AAA',margin:'0 0 4px'}},'Total spent'),
              e('div',{className:'display',style:{fontSize:'2rem',color:isOver?'#C04040':'#3A1A2E',lineHeight:1}},'S$'+fmt(totalSpent)),
              e('p',{style:{fontSize:12,color:'#B07090',margin:'4px 0 0'}},'of S$'+fmt(totalBudget)+' budget')
            ),
            e('div',{style:{textAlign:'right'}},
              e('p',{style:{fontSize:12,color:'#C09AAA',margin:'0 0 4px'}},'Remaining'),
              e('div',{className:'display',style:{fontSize:'1.45rem',color:remaining>=0?'#2D8B60':'#C04040',lineHeight:1}},(remaining<0?'-':'')+'S$'+fmt(Math.abs(remaining))),
              e('p',{style:{fontSize:11,color:remaining>=0?'#2D8B60':'#C04040',margin:'4px 0 0'}},remaining>=0?'under budget 🌸':'over budget')
            )
          ),
          e('div',{className:'progress-track'},e('div',{className:'progress-fill',style:{width:budPct+'%',background:isOver?'#C04040':'#E8709A'}})),
          e('p',{style:{fontSize:11,color:'#C09AAA',margin:'5px 0 0',textAlign:'right'}},budPct+'% used')
        ),
        e('div',{className:'card'},
          e('p',{className:'lbl'},'Spending breakdown'),
          chartData.length>0
            ?e('div',{style:{display:'flex',alignItems:'center',gap:16}},
                e(Donut,{data:chartData,size:130,inner:38,outer:58}),
                e('div',{style:{flex:1,minWidth:0}},chartData.map((item,i)=>e('div',{key:i,style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}},
                  e('div',{style:{display:'flex',alignItems:'center',gap:7,minWidth:0}},
                    e('div',{style:{width:9,height:9,borderRadius:'50%',background:item.color,flexShrink:0}}),
                    e('span',{style:{fontSize:13,color:'#8A5870',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},item.name)
                  ),
                  e('span',{style:{fontSize:13,fontWeight:700,flexShrink:0,marginLeft:4}},'S$'+fmt(item.value))
                )))
              )
            :e('p',{style:{fontSize:14,color:'#C09AAA',textAlign:'center',padding:'1rem 0'}},'No expenses yet this month 🎀')
        ),
        e('div',{className:'card'},
          e('p',{className:'lbl'},'Budget by category'),
          cats.map(c=>{
            const spent=spending[c.id]||0,budget=budgets[c.id]||0,over=spent>budget&&budget>0;
            const pct=budget>0?Math.min(Math.round((spent/budget)*100),100):0;
            return e('div',{key:c.id,style:{marginBottom:14}},
              e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}},
                e('div',{style:{display:'flex',alignItems:'center',gap:7}},
                  e('div',{style:{width:10,height:10,borderRadius:'50%',background:c.color,flexShrink:0}}),
                  e('span',{style:{fontSize:14}},c.label)
                ),
                e('span',{style:{fontSize:12,color:over?'#C04040':'#B07090'}},budget>0?'S$'+fmt(spent)+' / S$'+fmt(budget):'S$'+fmt(spent))
              ),
              budget>0
                ?e('div',{className:'progress-track'},e('div',{className:'progress-fill',style:{width:pct+'%',background:over?'#C04040':c.color}}))
                :e('p',{style:{fontSize:11,color:'#C09AAA',margin:'2px 0 0',fontStyle:'italic'}},'No budget set — go to Settings')
            );
          })
        ),
        monthExp.length>0&&e('div',{className:'card'},
          e('p',{className:'lbl'},'Transactions'),
          monthExp.map(exp=>{
            const c=catById(exp.category),isDel=delExpId===exp.id;
            return e('div',{key:exp.id,style:{borderRadius:12,overflow:'hidden',marginBottom:4}},
              e('div',{className:'txn-row'},
                e('div',{style:{display:'flex',alignItems:'center',gap:10,minWidth:0}},
                  e('div',{style:{width:40,height:40,borderRadius:13,background:(c?.color||'#888')+'28',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}},
                    e('div',{style:{width:12,height:12,borderRadius:'50%',background:c?.color||'#888'}})
                  ),
                  e('div',{style:{minWidth:0}},
                    e('p',{style:{fontSize:14,fontWeight:600,margin:0,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},exp.description),
                    e('p',{style:{fontSize:11,color:'#B07090',margin:'2px 0 0'}},
                      new Date(exp.date+'T00:00:00').toLocaleDateString('en-SG',{day:'numeric',month:'short'}),
                      ' · ',e('span',{style:{color:c?.color}},c?.label||'Unknown'),
                      exp.notes&&e('span',{style:{color:'#C09AAA'}},' · '+exp.notes)
                    )
                  )
                ),
                e('div',{style:{display:'flex',alignItems:'center',gap:2,flexShrink:0,marginLeft:8}},
                  e('span',{style:{fontSize:14,fontWeight:700,marginRight:2}},'S$'+fmt(exp.amount)),
                  e('button',{onClick:()=>startEdit(exp),className:'icon-btn','aria-label':'Edit'},'✏️'),
                  e('button',{onClick:()=>setDelExpId(isDel?null:exp.id),className:'icon-btn',style:{color:isDel?'#C04040':'#C09AAA'},'aria-label':'Delete'},'🗑️')
                )
              ),
              isDel&&e('div',{className:'danger-zone',style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
                e('span',{style:{fontSize:12,color:'#C04040'}},'Remove this entry?'),
                e('div',{style:{display:'flex',gap:8}},
                  e('button',{onClick:()=>setDelExpId(null),style:{fontSize:12,padding:'5px 12px'}},'Cancel'),
                  e('button',{onClick:()=>{setExp(p=>p.filter(ex=>ex.id!==exp.id));setDelExpId(null);},style:{fontSize:12,padding:'5px 12px',color:'#C04040',borderColor:'#E8A0B0'}},'Delete')
                )
              )
            );
          })
        )
      ),

      // ══ HISTORY ══
      tab==='history'&&e(React.Fragment,null,
        expenses.length===0
          ?e('div',{className:'card',style:{textAlign:'center',padding:'2.5rem 1rem'}},
              e('p',{style:{fontSize:32,marginBottom:12}},'🎀'),
              e('p',{style:{fontSize:15,color:'#8A5870',fontWeight:600},'className':'display'},'No history yet'),
              e('p',{style:{fontSize:13,color:'#C09AAA',marginTop:8},'key':'sub'},'Add your first expense to see monthly totals here!')
            )
          :histByYear.map(([year,months])=>
              e('div',{key:year,className:'card'},
                e('p',{className:'lbl'},year),
                months.map((m,i)=>{
                  const{spent,count}=getMonthTotals(m);
                  const isCur=m===curYm(),isSel=m===ym;
                  const pct=totalBudget>0?Math.min(Math.round((spent/totalBudget)*100),100):0;
                  return e('div',{key:m},
                    i>0&&e('div',{style:{height:1,background:'rgba(220,170,190,0.2)',margin:'2px 0'}}),
                    e('div',{className:'hist-row',onClick:()=>{setYm(m);setTab('home');}},
                      e('div',null,
                        e('div',{style:{display:'flex',alignItems:'center',gap:7,marginBottom:3}},
                          e('span',{style:{fontSize:15,fontWeight:600,color:isSel?'#E8709A':'#3A1A2E'}},ymLabel(m)),
                          isCur&&e('span',{style:{fontSize:10,background:'rgba(232,112,154,0.16)',color:'#E8709A',padding:'2px 8px',borderRadius:20,fontWeight:700}},'NOW')
                        ),
                        e('span',{style:{fontSize:12,color:'#C09AAA'}},count>0?count+' transaction'+(count!==1?'s':''):'No entries')
                      ),
                      e('div',{style:{display:'flex',alignItems:'center',gap:8}},
                        e('div',{className:'display',style:{fontSize:'1.05rem',color:spent>0?'#3A1A2E':'#C09AAA'}},spent>0?'S$'+fmt(spent):'—'),
                        e('span',{style:{fontSize:18,color:'#D4A0B8',lineHeight:1}},'›')
                      )
                    ),
                    spent>0&&totalBudget>0&&e('div',{className:'progress-track',style:{margin:'0 4px 6px'}},
                      e('div',{className:'progress-fill',style:{width:pct+'%',background:pct>=100?'#C04040':'#E8709A',opacity:.6}})
                    )
                  );
                })
              )
            )
      ),

      // ══ ADD / EDIT ══
      tab==='add'&&e('div',{className:'card'},
        e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1.25rem'}},
          e('h2',{className:'display',style:{fontSize:'1.3rem',color:'#3A1A2E'}},editId?'Edit expense ✏️':'New expense 🎀'),
          editId&&e('button',{onClick:cancelEdit,className:'cancel-link'},'Cancel')
        ),
        e('div',{className:'field'},
          e('label',null,'Description'),
          e('input',{ref:descRef,type:'text',placeholder:'e.g. Grab to Orchard',value:form.description,onChange:sf('description'),className:formErr.description?'err':'',autoComplete:'off',autoCorrect:'off'})
        ),
        e('div',{className:'field'},
          e('label',null,'Amount (SGD)'),
          e('input',{type:'number',inputMode:'decimal',placeholder:'0.00',min:'0',step:'0.01',value:form.amount,onChange:sf('amount'),className:formErr.amount?'err':''})
        ),
        e('div',{className:'field'},
          e('label',null,'Category'),
          e('select',{value:form.category,onChange:sf('category')},cats.map(c=>e('option',{key:c.id,value:c.id},c.label)))
        ),
        e('div',{className:'field'},
          e('label',null,'Date'),
          e('input',{type:'date',value:form.date,onChange:sf('date')})
        ),
        e('div',{style:{marginBottom:'1.25rem'}},
          e('label',{style:{fontSize:13,color:'#8A5870',display:'block',marginBottom:5}},'Notes (optional)'),
          e('input',{type:'text',placeholder:'e.g. split with friends',value:form.notes,onChange:sf('notes')})
        ),
        Object.values(formErr).some(Boolean)&&e('p',{style:{fontSize:12,color:'#C04040',marginBottom:'0.75rem',textAlign:'center'}},'Please fill in the highlighted fields 🎀'),
        e('button',{onClick:submit,className:'btn-primary',style:{width:'100%',padding:'14px',fontSize:15}},editId?'Save changes':'Add expense')
      ),

      // ══ SETTINGS ══
      tab==='settings'&&e(React.Fragment,null,
        e('div',{className:'card'},
          e('h2',{className:'display',style:{fontSize:'1.3rem',margin:'0 0 1.2rem',color:'#3A1A2E'}},'Monthly budgets 💰'),
          cats.map(c=>e('div',{key:c.id,className:'field'},
            e('label',{style:{display:'flex',alignItems:'center',gap:6}},
              e('div',{style:{width:10,height:10,borderRadius:'50%',background:c.color,flexShrink:0}}),c.label
            ),
            e('input',{type:'number',inputMode:'decimal',min:'0',step:'1',value:budDraft[c.id]??0,onChange:ev=>setBudDraft(b=>({...b,[c.id]:parseFloat(ev.target.value)||0}))})
          )),
          e('div',{style:{background:'rgba(255,220,235,0.55)',borderRadius:13,padding:'11px 14px',display:'flex',justifyContent:'space-between',marginBottom:'1.2rem'}},
            e('span',{style:{fontSize:14,color:'#8A5870'}},'Total monthly budget'),
            e('span',{className:'display',style:{fontSize:'1rem',color:'#3A1A2E'}},'S$'+fmt(cats.reduce((s,c)=>s+(budDraft[c.id]||0),0)))
          ),
          e('button',{onClick:saveBudgets,className:'btn-primary',style:{width:'100%',padding:'14px',fontSize:15}},saved?'✓ Saved!':'Save budgets')
        ),
        e('div',{className:'card'},
          e('h2',{className:'display',style:{fontSize:'1.3rem',margin:'0 0 1.2rem',color:'#3A1A2E'}},'Categories 🎀'),
          cats.map(c=>{const isDel=delCatId===c.id;return e('div',{key:c.id,style:{borderRadius:12,overflow:'hidden',marginBottom:4}},
            e('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'11px 4px'}},
              e('div',{style:{display:'flex',alignItems:'center',gap:9}},
                e('div',{style:{width:14,height:14,borderRadius:'50%',background:c.color,flexShrink:0}}),
                e('span',{style:{fontSize:15}},c.label)
              ),
              e('button',{onClick:()=>setDelCatId(isDel?null:c.id),className:'icon-btn',style:{color:isDel?'#C04040':'#C09AAA'},'aria-label':'Delete '+c.label},'🗑️')
            ),
            isDel&&e('div',{className:'danger-zone'},
              e('p',{style:{fontSize:12,color:'#C04040',marginBottom:8}},'"'+c.label+'" and all its expenses will be deleted.'),
              e('div',{style:{display:'flex',gap:8}},
                e('button',{onClick:()=>setDelCatId(null),style:{fontSize:13,padding:'6px 14px'}},'Cancel'),
                e('button',{onClick:()=>delCat(c.id),style:{fontSize:13,padding:'6px 14px',color:'#C04040',borderColor:'#E8A0B0'}},'Yes, delete')
              )
            )
          );}),
          e('div',{style:{borderTop:'1px solid rgba(220,170,190,0.3)',marginTop:'1rem',paddingTop:'1rem'}},
            e('p',{style:{fontSize:13,color:'#8A5870',marginBottom:10,fontWeight:500}},'Add new category'),
            e('input',{type:'text',placeholder:'e.g. Gifts, Travel, Gym...',value:newCat.label,onChange:ev=>setNewCat(n=>({...n,label:ev.target.value})),style:{marginBottom:10}}),
            e('div',{style:{display:'flex',flexWrap:'wrap',gap:10,marginBottom:14}},
              PALETTE.map(col=>e('div',{key:col,onClick:()=>setNewCat(n=>({...n,color:col})),className:'swatch'+(newCat.color===col?' sel':''),style:{background:col}}))
            ),
            e('button',{onClick:addCat,className:'btn-primary',style:{width:'100%',padding:'14px',fontSize:15}},'+ Add category')
          )
        )
      )
    ),

    // ── Bottom nav ──
    e('nav',{className:'bottom-nav','aria-label':'Main navigation'},
      [{id:'home',label:'Home'},{id:'history',label:'History'},{id:'add',label:'Add'},{id:'settings',label:'Settings'}]
        .map(item=>e('button',{key:item.id,className:'nav-btn'+(tab===item.id?' active':''),onClick:()=>goTo(item.id),'aria-label':item.label},
          e(NavIcon,{id:item.id}),e('span',null,item.label)
        ))
    )
  );
}
ReactDOM.render(React.createElement(App),document.getElementById('root'));
</script>
</body>
</html>
